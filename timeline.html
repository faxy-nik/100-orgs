<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline &mdash; 100 prghs for eeshah</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A1%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="fb-db.js"></script>
  <script src="feature-flags.js"></script>
  <style>
    :root { --ink: #17130f; --page: #f5efe6; --accent: #b8864e; --accent-dim: #b8864e44; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--page); color: var(--ink); font-family: 'Lora', Georgia, serif; line-height: 1.6; min-height: 100vh; }
    ::selection { background: var(--accent); color: #fff; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #e8ddd0; } ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
    .container { max-width: 680px; margin: 0 auto; padding: 3rem 1.5rem; }
    h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 2rem; color: var(--ink); text-align: center; margin-bottom: .25rem; }
    .subtitle { text-align: center; color: #8a7a6a; font-size: .85rem; font-style: italic; margin-bottom: 3rem; }
    .tl-line { position: relative; padding-left: 2.5rem; margin-bottom: 2.5rem; }
    .tl-line::before { content: ''; position: absolute; left: 8px; top: 8px; bottom: -2.5rem; width: 2px; background: #d4c5b2; }
    .tl-line:last-child::before { display: none; }
    .tl-dot { position: absolute; left: 0; top: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--page); }
    .tl-date { font-size: .75rem; color: #8a7a6a; margin-bottom: 2px; font-family: 'Fraunces', Georgia, serif; }
    .tl-title { font-size: 1rem; font-weight: 600; color: var(--ink); margin-bottom: 4px; font-family: 'Fraunces', Georgia, serif; }
    .tl-body { font-size: .88rem; color: #5a4a3a; line-height: 1.7; }
    .tl-img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
    .empty { text-align: center; color: #8a7a6a; font-style: italic; padding: 4rem 0; }
    .loader { text-align: center; color: #8a7a6a; padding: 4rem 0; }
    .back { display: block; text-align: center; margin-top: 3rem; color: #8a7a6a; text-decoration: none; font-size: .85rem; transition: color .25s; }
    .back:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <h1>&#x1F4C5; our timeline</h1>
    <p class="subtitle">every moment worth remembering</p>
    <div id="timelineList"><div class="loader">loading memories...</div></div>
    <a href="index.html" class="back">&larr; back to home</a>
  </div>
  <script src="global-easter-eggs.js"></script>
<script defer src="interactions.js"></script>
<script src="activity-tracker.js"></script>
  <script src="events.js"></script>
  <script src="puzzle-hunt.js"></script>
  <script src="letters.js"></script>
  <script>
    (function () {
      var list = document.getElementById('timelineList');
      if (typeof FB === 'undefined') { list.innerHTML = '<div class="empty">Could not load memories.</div>'; return; }
      FB.init();

      function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

      function friendlyPage(p) {
        var map = { 'index': 'Home', 'love': 'Love', '100-organs': '100 Organs', 'fantasies': 'Fantasies', 'sky-observatory': 'Sky Observatory', 'photo-gallery': 'Photo Gallery', 'timeline': 'Timeline', 'dream': 'Dream Journal', 'make-her-sleep': 'Make Her Sleep', 'story': 'Our Story', 'stats': 'Stats', 'admin': 'Admin' };
        return map[p] || p;
      }

      function entryHtml(e) {
        if (e.type === 'activity' || e.activityType) {
          var aType = e.activityType || e.type;
          var page = friendlyPage(e.page || '');
          var label = '';
          var extra = '';
          if (aType === 'page-visit') {
            label = 'Visited ' + page;
            if (e.referrer && e.referrer !== page) extra = ' from ' + friendlyPage(e.referrer);
          } else if (aType === 'section-view') {
            label = 'Read section ' + (e.sectionIdx + 1) + ' on ' + page;
          } else if (aType === 'review') {
            label = 'Left a ' + esc(e.reviewType) + ' review on ' + page;
            if (e.sectionIdx !== undefined) extra = ' (section ' + (e.sectionIdx + 1) + ')';
          } else if (aType === 'image-view') {
            label = 'Viewed ' + esc(e.file);
          } else if (aType === 'navigate') {
            label = 'Clicked "' + esc(e.linkText || '') + '" \u2192 ' + friendlyPage(e.to || '');
          } else if (aType === 'time-spent') {
            var mins = Math.floor((e.seconds || 0) / 60);
            var secs = (e.seconds || 0) % 60;
            label = 'Spent ' + mins + 'm ' + secs + 's on ' + page;
          } else {
            label = esc(aType) + ' on ' + page;
          }
          var date = new Date(e.timestamp).toLocaleDateString() + ' ' + new Date(e.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          var dotColor = aType === 'navigate' ? '#6fcf97' : aType === 'time-spent' ? '#b8a8f0' : '#8a7a6a';
          return '<div class="tl-line" style="opacity:.7;">' +
            '<div class="tl-dot" style="background:' + dotColor + ';"></div>' +
            '<div class="tl-date">' + date + '</div>' +
            '<div class="tl-body" style="font-size:.8rem;">' + label + '<span style="color:#6b5f52;font-size:.75rem;">' + extra + '</span></div>' +
          '</div>';
        }
        return '<div class="tl-line">' +
          '<div class="tl-dot"></div>' +
          '<div class="tl-date">' + esc(e.date || '') + (e.year ? ', ' + esc(e.year) : '') + '</div>' +
          '<div class="tl-title">' + esc(e.title || '') + '</div>' +
          (e.body ? '<div class="tl-body">' + esc(e.body) + '</div>' : '') +
          (e.img ? '<img class="tl-img" src="' + esc(e.img) + '" alt="">' : '') +
        '</div>';
      }

      Promise.all([
        FB.get('config', 'timeline').then(function (data) { return (data && data.list) || []; }),
        FB.getAll('activity').then(function (items) {
          return (items || []).map(function (a) { a.activityType = a.type || 'event'; a.type = 'activity'; return a; });
        })
      ]).then(function (results) {
        var memories = results[0];
        var activity = results[1];
        if (!memories.length && !activity.length) {
          list.innerHTML = '<div class="empty">No activity yet. It will appear here.</div>';
          return;
        }
        var all = [];
        memories.forEach(function (m) { all.push({ sortKey: (m.year || '0000') + '-' + (m.date || '01-01') + '-000000', html: entryHtml(m) }); });
        activity.forEach(function (a) { all.push({ sortKey: '9999-99-99-' + String(9999999999999 - (a.timestamp || 0)).padStart(13, '0'), html: entryHtml(a) }); });
        all.sort(function (a, b) { return a.sortKey.localeCompare(b.sortKey); });
        var html = '';
        for (var i = 0; i < all.length; i++) html += all[i].html;
        list.innerHTML = html;
      }).catch(function () {
        list.innerHTML = '<div class="empty">Could not load timeline.</div>';
      });
    })();
  </script>
</body>
</html>
