<style>
:root{
  --bg: #0a0d16;
  --bg-alt: #0d1120;
  --surface: rgba(21, 26, 43, 0.6);
  --surface-solid: #151a2b;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.14);
  --text: #e8ecf4;
  --text-dim: #a8b0c3;
  --text-mute: #6b7387;
  --violet: #8b5cf6;
  --cyan: #22d3ee;
  --amber: #f5a623;
  --rose: #e88aa6;
  --grad-aurora: linear-gradient(120deg, var(--violet), var(--cyan));
  --grad-dawn: linear-gradient(120deg, var(--amber), var(--rose));
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --sidebar-w: 264px;
  --sidebar-w-collapsed: 76px;
  --topbar-h: 68px;
  --ease: cubic-bezier(.22,.9,.34,1);
}
*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-body); -webkit-font-smoothing:antialiased; min-height:100vh;
}
h1,h2,h3{ font-family:var(--font-display); font-weight:600; margin:0 0 .4em; letter-spacing:-0.01em; }
p{ margin:0 0 1em; color:var(--text-dim); line-height:1.6; }
a{ color:inherit; text-decoration:none; }
ul, ol{ margin:0 0 1em; padding-left:1.25em; }
li{ color:var(--text-dim); margin-bottom:.25em; }
code{
  font-family:var(--font-mono); background:var(--surface); padding:.1em .4em;
  border-radius:4px; font-size:.85em; color:var(--cyan);
}
pre{
  background:var(--surface-solid); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:.8em 1em; overflow-x:auto;
  font-family:var(--font-mono); font-size:.8em; color:var(--text-dim); margin-bottom:1em;
}
table{ width:100%; border-collapse:collapse; margin-bottom:1em; font-size:.82em; }
th, td{ padding:.5em .6em; text-align:left; border-bottom:1px solid var(--border); vertical-align:top; }
th{ font-family:var(--font-display); color:var(--text-mute); font-weight:600; font-size:.7em; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; }
td{ color:var(--text-dim); }
td:first-child{ font-family:var(--font-mono); color:var(--text); white-space:nowrap; }
tr:hover td{ background:rgba(255,255,255,.02); }
::selection{ background:var(--violet); color:#fff; }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
}

#sky-canvas{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.55; }
.app{ position:relative; z-index:1; display:flex; min-height:100vh; }

.sidebar{
  width:var(--sidebar-w); flex:none;
  background:rgba(13,16,28,0.7); backdrop-filter:blur(20px);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; transition:width .25s var(--ease); z-index:40;
  overflow:hidden;
}
.sidebar-head{
  height:var(--topbar-h); flex:none;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; border-bottom:1px solid var(--border);
}
.brand{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:600; font-size:15px; white-space:nowrap; }
.brand-mark{
  width:30px;height:30px;border-radius:9px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--grad-aurora); color:#0a0d16; font-size:16px;
}
.nav{ flex:1; overflow-y:auto; padding:16px 12px; }
.nav-group + .nav-group{ margin-top:22px; }
.nav-label{
  font-size:11px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--text-mute); padding:0 10px; margin:0 0 8px;
}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:9px 10px; border-radius:10px; font-size:13.5px; color:var(--text-dim);
  white-space:nowrap; transition:background .15s, color .15s; margin-bottom:2px;
}
.nav-item:hover{ background:var(--surface); color:var(--text); }
.nav-item.active{ background:linear-gradient(90deg, rgba(139,92,246,.18), rgba(34,211,238,.06)); color:#fff; box-shadow:inset 2px 0 0 var(--violet); }

.main{ flex:1; min-width:0; }
.topbar{
  height:var(--topbar-h); position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:16px; padding:0 24px;
  background:rgba(10,13,22,0.65); backdrop-filter:blur(16px); border-bottom:1px solid var(--border);
}
.crumbs{ font-family:var(--font-mono); font-size:12.5px; color:var(--text-mute); }
.scroll-progress-wrap{ position:absolute; left:0; right:0; bottom:-1px; height:2px; background:transparent; }
.scroll-progress{ height:100%; width:0%; background:var(--grad-aurora); transition:width .1s linear; }

.content{ padding:32px 40px 90px; max-width:960px; width:100%; margin:0 auto; }
.content h2{
  font-size:1.15em; color:var(--text); margin-top:2em; margin-bottom:.6em;
  padding-bottom:.3em; border-bottom:1px solid var(--border);
}
.content h3{ font-size:.95em; color:var(--text); margin-top:1.5em; margin-bottom:.4em; }
.content .lead{ font-size:15.5px; max-width:680px; }
.content .back-link{ display:inline-block; font-size:.8em; color:var(--text-mute); margin-bottom:1em; transition:color .15s; }
.content .back-link:hover{ color:var(--violet); }

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:18px 20px; backdrop-filter:blur(10px); margin-bottom:.5em;
}
.card h3{ font-size:.9em; margin-bottom:.3em; }
.card p{ font-size:.8em; margin:0; }

.back-to-top{
  position:fixed; bottom:28px; right:28px; width:44px; height:44px; border-radius:50%;
  background:var(--surface-solid); border:1px solid var(--border-strong); color:var(--text);
  font-size:16px; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  z-index:50; backdrop-filter:blur(10px);
}
.back-to-top.visible{ opacity:1; pointer-events:auto; }
.back-to-top:hover{ transform:translateY(-2px); }

@media (max-width: 860px){
  .sidebar{ position:fixed; left:0; top:0; height:100vh; transform:translateX(-100%); box-shadow:20px 0 60px rgba(0,0,0,.4); }
  .app.mobile-nav-open .sidebar{ transform:translateX(0); }
  .content{ padding:22px 16px 90px; }
}
</style>

/* Scroll highlight + progress */
(function(){
  var sections = document.querySelectorAll('.doc-section');
  var navItems = document.querySelectorAll('.nav-item');
  var scrollProg = document.getElementById('scrollProgress');
  var backBtn = document.getElementById('backToTop');
  function onScroll(){
    var scrollY = window.scrollY + 120;
    var activeId = null;
    for(var i=0;i<sections.length;i++){
      if(sections[i].offsetTop <= scrollY) activeId = sections[i].id.replace('sec-','');
    }
    navItems.forEach(function(n){
      n.classList.toggle('active', n.getAttribute('href') === '#' + activeId);
    });
    var h = document.documentElement;
    var pct = (h.scrollTop) / (h.scrollHeight - h.clientHeight || 1) * 100;
    scrollProg.style.width = pct+'%';
    backBtn.classList.toggle('visible', h.scrollTop > 400);
  }
  window.addEventListener('scroll', onScroll);
  onScroll();
  backBtn.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
})();

/* Sky canvas */
(function(){
  var canvas = document.getElementById('sky-canvas');
  var ctx = canvas.getContext('2d');
  var w, h, stars = [];
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    stars = Array.from({length: Math.floor(w*h/9000)}, function(){
      return {x:Math.random()*w, y:Math.random()*h*0.6, r:Math.random()*1.3+0.2, phase:Math.random()*Math.PI*2, speed:0.5+Math.random()};
    });
  }
  window.addEventListener('resize', resize);
  resize();
  var t=0;
  function frame(){
    t += 0.008;
    ctx.clearRect(0,0,w,h);
    var grad = ctx.createLinearGradient(0,0,0,h);
    var hue = 250 + Math.sin(t*0.15)*20;
    grad.addColorStop(0, 'hsla('+hue+', 60%, 12%, 0.9)');
    grad.addColorStop(1, 'hsla('+(hue+40)+', 50%, 6%, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h*0.7);
    ctx.fillStyle = '#eaeefc';
    stars.forEach(function(s){
      var tw = 0.5 + 0.5*Math.sin(t*s.speed + s.phase);
      ctx.globalAlpha = 0.15 + tw*0.5;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
