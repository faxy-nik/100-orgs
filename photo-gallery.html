    :root {

      line-height: 1.8;

      overflow-x: hidden;

      text-align: center;

    .page-header h1 {
      font-family: var(--font-display);
      font-weight: 600;

      margin: 0 0 0.5rem;
      text-shadow: 0 0 30px rgba(255, 230, 128, .3), 0 2px 4px rgba(0,0,0,.6);
    }
    .page-header p {
      color: var(--parchment-dim);
      font-size: clamp(0.9rem, 2vw, 1rem);
      font-style: italic;
      margin: 0;
    }
    .gallery {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--pad-inline) clamp(4rem, 10vh, 6rem);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      content-visibility: auto;
    }
    .gallery-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: var(--glass);
      border: 1px solid var(--glassBorder);
      cursor: pointer;
      transition: border-color 0.3s, transform 0.25s, box-shadow 0.3s;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gallery-item:hover {
      border-color: var(--gold);
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(255, 230, 128, .12);
      z-index: 2;
    }
    .gallery-item img,
    .gallery-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.4s ease;
    }
    .gallery-item img { background: rgba(255, 220, 160, .04); }
    .gallery-item img, .gallery-item video { opacity: 0; }
    .gallery-item img.loaded, .gallery-item video.loaded { opacity: 1; }
    .gallery-item .play-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .gallery-item:hover .play-badge { opacity: 1; }
    .gallery-item .play-badge svg {
      width: 48px;
      height: 48px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.5));
    }
    .item-glass {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
      background: rgba(24, 18, 20, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .gallery-item:hover .item-glass { opacity: 1; }
    .gallery-item .item-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.2rem 0.75rem 0.6rem;
      background: linear-gradient(transparent, rgba(0,0,0,.7));
      font-family: var(--font-display);
      font-size: 0.8rem;
      color: var(--parchment);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 3;
    }
    .gallery-item:hover .item-label { opacity: 1; }
    .gallery-item .item-note {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      padding: 0.75rem 1rem;
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-style: italic;
      color: var(--parchment);
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
      text-align: center;
      line-height: 1.5;
      z-index: 3;
      text-shadow: 0 1px 4px rgba(0,0,0,.6);
    }
    .gallery-item:hover .item-note { opacity: 1; }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,.92);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .lightbox.open { display: flex; opacity: 1; }
    .lightbox-media {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
      object-fit: contain;
    }
    .lightbox-media.video-el {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 8px;
    }
    .lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1.25rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255,210,150,.15);
      background: rgba(0,0,0,.4);
      color: var(--parchment);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      z-index: 10;
    }
    .lightbox-close:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(255,230,128,.1);
    }
    .lightbox-prev, .lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,210,150,.1);
      background: rgba(0,0,0,.3);
      color: var(--parchment);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      z-index: 10;
    }
    .lightbox-prev { left: 1rem; }
    .lightbox-next { right: 1rem; }
    .lightbox-prev:hover, .lightbox-next:hover {

      color: var(--gold);
      background: rgba(255,230,128,.1);
    }
    .lightbox-counter {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-display);
      font-size: 0.8rem;
      color: var(--ash);

    .lightbox-note {

      bottom: 3.5rem;
      left: 50%;
      transform: translateX(-50%);

      font-family: var(--font-body);
      font-size: 0.9rem;

    body {

 background: transparent !important; }

        { type: 'video', file: 'ash/her video inlight pink dress and pink scarf in uni , looking cute (front).mp4', label: 'Pink Uni Look', note: 'pink dress, pink scarf, university backdrop ï¿½ you looked so cute i forgot what i was supposed to be looking at' },
        { type: 'video', file: 'ash/video regarding my eyes.mp4', label: 'Regarding My Eyes', note: 'a video about my eyes ï¿½ but all i could see was yours, and how they hold the whole universe when you look at me' },
        { type: 'video', file: 'ash/she studying on her bed selfie.mp4', label: 'Studying on Bed', note: 'studying on your bed, focused and soft ï¿½ you make even homework look beautiful' },
        { type: 'video', file: 'ash/mirror pic video.mp4', label: 'Mirror Pic', note: 'mirror pic video ï¿½ you, capturing yourself, and accidentally capturing my whole heart in the process' },
        { type: 'video', file: 'ash/love video of uss.mp4', label: 'Love Video of Us', note: 'a love video of us ï¿½ this is the evidence i would show the jury if they asked me what love looks like' },
        { type: 'video', file: 'ash/her younger self video front camera.mp4', label: 'Younger Self', note: 'your younger self, on front camera ï¿½ and i wish i could go back in time to tell her how loved she will be' },
        { type: 'video', file: 'ash/my random vido.mp4', label: 'Random Video', note: 'a random video of mine ï¿½ but knowing you watched it makes it the most important video i have ever made' },
        { type: 'video', file: 'ash/eye roll video in blue dress nad dark blue scarf , looking fierce9front).mp4', label: 'Eye Roll Fierce', note: 'eye roll in blue with a dark scarf, looking absolutely fierce ï¿½ and i am completely, helplessly intimidated (in love)' }
      ];

      var MEDIA = [];
      var grid = document.getElementById('galleryGrid');
      var lightbox = document.getElementById('lightbox');
      var lbClose = document.getElementById('lbClose');
      var lbPrev = document.getElementById('lbPrev');
      var lbNext = document.getElementById('lbNext');
      var lbCounter = document.getElementById('lbCounter');
      var lbNote = document.getElementById('lbNote');
      var currentIndex = -1;

      function loadMedia() {
        try {
          FB.get('config', 'gallery').then(function (data) {
            var existing = (data && data.items && data.items.length) ? data.items : [];
            var fileSet = {};
            for (var ei = 0; ei < existing.length; ei++) fileSet[existing[ei].file] = true;
            var noteMap = {};
            for (var di = 0; di < DEFAULT_MEDIA.length; di++) noteMap[DEFAULT_MEDIA[di].file] = DEFAULT_MEDIA[di].note;
            var changed = false;
            for (var si = 0; si < existing.length; si++) {
              if (!existing[si].note && noteMap[existing[si].file]) {
                existing[si].note = noteMap[existing[si].file];
                changed = true;
              }
            }
            for (var di = 0; di < DEFAULT_MEDIA.length; di++) {
              if (!fileSet[DEFAULT_MEDIA[di].file]) {
                existing.push(DEFAULT_MEDIA[di]);
                changed = true;
              }
            }
            MEDIA = existing;
            if (changed) { FB.put('config', { id: 'gallery', items: MEDIA }); }
            render();
          }).catch(function () {
            MEDIA = DEFAULT_MEDIA.slice();
            render();
          });
        } catch (e) {
          MEDIA = DEFAULT_MEDIA.slice();
          render();
        }
      }

      function getUrl(m) {
        if (m.fileData) {
          return URL.createObjectURL(new Blob([m.fileData], { type: m.fileType || 'image/jpeg' }));
        }
        return m.file;
      }

      function render() {
        var html = '';
        for (var i = 0; i < MEDIA.length; i++) {
          var m = MEDIA[i];
          var isVideo = m.type === 'video';
          var src = getUrl(m);
          html += '<div class="gallery-item" data-index="' + i + '">';
          html += '<div class="item-glass"></div>';
          if (isVideo) {
            html += '<video preload="metadata" muted playsinline>' +
              '<source src="' + src + '" type="' + (m.fileType || 'video/mp4') + '">' +
              '</video>';
            html += '<div class="play-badge"><svg viewBox="0 0 24 24" fill="rgba(255,230,128,.9)"><path d="M8 5v14l11-7z"/></svg></div>';
          } else {
            html += '<img src="' + src + '" alt="' + m.label + '" loading="lazy">';
          }
          html += '<div class="item-label">' + esc(m.label) + '</div>';
          if (m.note) {
            html += '<div class="item-note">' + esc(m.note) + '</div>';
          }
          html += '</div>';
        }
        grid.innerHTML = html;

        grid.querySelectorAll('img').forEach(function (img) {
          if (img.complete) { img.classList.add('loaded'); }
          else {
            img.addEventListener('load', function () { this.classList.add('loaded'); });
            img.addEventListener('error', function () { this.classList.add('loaded'); });
          }
        });
        grid.querySelectorAll('video').forEach(function (v) {
          if (v.readyState >= 2) { v.classList.add('loaded'); }
          else {
            v.addEventListener('loadeddata', function () { this.classList.add('loaded'); });
            v.addEventListener('error', function () { this.classList.add('loaded'); });
          }
        });
        setTimeout(function () {
          grid.querySelectorAll('img:not(.loaded), video:not(.loaded)').forEach(function (el) { el.classList.add('loaded'); });
        }, 3000);

        grid.querySelectorAll('.gallery-item').forEach(function (item) {
          item.addEventListener('click', function () {
            var idx = parseInt(this.dataset.index);
            openLightbox(idx);
          });
        });
      }

      function openLightbox(idx) {
        currentIndex = idx;
        var m = MEDIA[idx];
        updateLightbox(m, idx);
        lightbox.classList.add('open');
      }

      function updateLightbox(m, idx) {
        var old = lightbox.querySelector('.lightbox-media, .lightbox-media.video-el');
        if (old) old.remove();

        var src = getUrl(m);
        var el;
        if (m.type === 'video') {
          el = document.createElement('video');
          el.className = 'lightbox-media video-el';
          el.controls = true;
          el.autoplay = true;
          el.innerHTML = '<source src="' + src + '" type="' + (m.fileType || 'video/mp4') + '">';
        } else {
          el = document.createElement('img');
          el.className = 'lightbox-media';
          el.src = src;
          el.alt = m.label;
        }
        lightbox.insertBefore(el, lightbox.querySelector('.lightbox-counter'));
        lbCounter.textContent = (idx + 1) + ' / ' + MEDIA.length;
        lbNote.textContent = m.note || '';
      }

      lbClose.addEventListener('click', function closeLightbox() {
        lightbox.classList.remove('open');
        var video = lightbox.querySelector('video.lightbox-media');
        if (video) { video.pause(); video.src = ''; video.load(); }
        currentIndex = -1;
      });

      lbPrev.addEventListener('click', function () {
        if (currentIndex <= 0) return;
        var video = lightbox.querySelector('video.lightbox-media');
        if (video) { video.pause(); video.src = ''; video.load(); }
        currentIndex--;
        updateLightbox(MEDIA[currentIndex], currentIndex);
      });

      lbNext.addEventListener('click', function () {
        if (currentIndex >= MEDIA.length - 1) return;
        var video = lightbox.querySelector('video.lightbox-media');
        if (video) { video.pause(); video.src = ''; video.load(); }
        currentIndex++;
        updateLightbox(MEDIA[currentIndex], currentIndex);
      });

      document.addEventListener('keydown', function (e) {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') { lightbox.classList.remove('open'); var v = lightbox.querySelector('video.lightbox-media'); if (v) { v.pause(); v.src = ''; v.load(); } currentIndex = -1; }
        if (e.key === 'ArrowLeft') lbPrev.click();
        if (e.key === 'ArrowRight') lbNext.click();
      });

      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) { lightbox.classList.remove('open'); var v = lightbox.querySelector('video.lightbox-media'); if (v) { v.pause(); v.src = ''; v.load(); } currentIndex = -1; }
      });

      function esc(str) {
        if (typeof str !== 'string') return '';
        var d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      }

      loadMedia();

      // ponytail: upload images to parallax pool
      // stored in localStorage, content-common.js randomly assigns ~10 sections
      var uploadBtn = document.createElement('button');
      uploadBtn.textContent = '\uD83D\uDCC1 Use in 100 Organs';
      uploadBtn.title = 'Upload an image to randomly appear in the 100 Organs parallax';
      uploadBtn.style.cssText = 'background:rgba(255,220,160,.08);border:1px solid rgba(255,210,150,.15);color:#6b5f52;padding:.4rem .9rem;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.8rem;transition:all .25s;display:inline-block;margin:0 .4rem;';
      var btnContainer = document.querySelector('div[style*="text-align:center"]') || document.body;
      btnContainer.appendChild(uploadBtn);

      var fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.multiple = true;
      fileInput.style.display = 'none';
      document.body.appendChild(fileInput);

      uploadBtn.addEventListener('click', function () { fileInput.click(); });
      uploadBtn.addEventListener('mouseenter', function () { this.style.borderColor = 'rgba(255,230,128,.5)'; this.style.color = '#ffe680'; });
      uploadBtn.addEventListener('mouseleave', function () { this.style.borderColor = 'rgba(255,210,150,.2)'; this.style.color = '#c8b89e'; });

      fileInput.addEventListener('change', function () {
        var files = this.files;
        if (!files.length) return;
        var existing = [];
        try { existing = JSON.parse(localStorage.getItem('ash-user-parallax') || '[]'); } catch (e) {}
        var loaded = 0;
        var total = files.length;
        for (var fi = 0; fi < files.length; fi++) {
          (function (file) {
            var reader = new FileReader();
            reader.onload = function (e) {
              var dataUrl = e.target.result;
              existing.push(dataUrl);
              MEDIA.push({ type: 'image', fileData: dataUrl, fileType: file.type, label: 'User Upload', note: '' });
              loaded++;
              if (loaded === total) {
                try {
                  localStorage.setItem('ash-user-parallax', JSON.stringify(existing));
                  render();
                  uploadBtn.textContent = '\u2705 ' + total + ' added (' + existing.length + ' total)';
                  setTimeout(function () { uploadBtn.textContent = '\uD83D\uDCC1 Use in 100 Organs'; }, 3000);
                } catch (err) {
                  uploadBtn.textContent = '\u26A0\uFE0F Storage full ï¿½ remove some';
                  setTimeout(function () { uploadBtn.textContent = '\uD83D\uDCC1 Use in 100 Organs'; }, 3000);
                }
              }
            };
            reader.readAsDataURL(file);
          })(files[fi]);
        }
      });
    })();
  </script>
