<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#181214">
<title>i remember</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { margin: 0; background: #181214; }
  body { min-height: 100vh; font-family: Georgia, serif; color: #ffebd2; overflow-x: hidden; }
  .rm-stage {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2.5rem 1.4rem; box-sizing: border-box; text-align: center; position: relative;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(48,42,66,.4), transparent 55%),
      radial-gradient(ellipse at 50% 110%, rgba(255,230,128,.04), transparent 60%);
  }
  .rm-star { position: fixed; width: 2px; height: 2px; border-radius: 50%; background: #ffe680; opacity: .22; pointer-events: none; }
  .rm-hidden { opacity: 0; }
  .rm-kicker { color: #8a7a68; font-size: .72rem; letter-spacing: .35em; text-transform: uppercase; }
  .rm-line { transition: opacity 1.3s ease; }
  .rm-title { color: #ffe680; font-style: italic; font-size: 1.5rem; letter-spacing: .1em; margin-top: 1.2rem; text-shadow: 0 0 24px rgba(255,230,128,.28); }
  .rm-card {
    margin-top: 2.2rem; max-width: 460px; width: 100%; padding: 1.8rem 1.5rem; box-sizing: border-box;
    border-top: 1px solid rgba(255,230,128,.18); border-bottom: 1px solid rgba(255,230,128,.18);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  .rm-card p { color: #e4d3be; font-style: italic; font-size: 1.02rem; line-height: 1.85; margin: 0; }
  .rm-cat { color: #c9a24b; font-size: .7rem; letter-spacing: .28em; text-transform: uppercase; margin-bottom: 1rem; }
  .rm-rare { color: #ffe680; font-size: .7rem; letter-spacing: .3em; text-transform: uppercase; opacity: .75; margin-top: 1rem; }
  .rm-btn {
    margin-top: 2.4rem; padding: .7rem 1.7rem; border: 1px solid rgba(255,230,128,.28); border-radius: 999px;
    background: transparent; color: #ffe680; font-family: Georgia, serif; font-style: italic; font-size: .9rem;
    letter-spacing: .06em; cursor: pointer; transition: background .3s ease, border-color .3s ease; opacity: 0;
  }
  .rm-btn:hover { background: rgba(255,230,128,.1); border-color: rgba(255,230,128,.55); }
  .rm-btn.rm-show { opacity: 1; }
  .rm-btn:disabled { opacity: .35; cursor: default; }
  .rm-footer { margin-top: 3rem; font-size: .7rem; color: #4a4034; letter-spacing: .25em; }
  .rm-quiet { color: #a08f7e; font-style: italic; font-size: .98rem; line-height: 1.9; }
  @media (prefers-reduced-motion: reduce) {
    .rm-line, .rm-card { transition: none; }
    .rm-star { display: none; }
  }
</style>
</head>
<body>
<div class="rm-stage">
  <div class="rm-kicker">i remember</div>
  <div class="rm-title rm-line rm-hidden" id="rmTitle">I remember...</div>
  <div class="rm-card rm-hidden" id="rmCard"></div>
  <button class="rm-btn" id="rmNext">Another memory</button>
  <div class="rm-footer">ash</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="fb-db.js"></script>
<script src="global-easter-eggs.js"></script>
<script src="activity-tracker.js"></script>

<script>
(function () {
  'use strict';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DELAY = reduce ? 300 : 1400;

  var HISTORY_KEY = 'ash_memory_history';
  var ONCE_KEY = 'ash_memory_once';
  var HISTORY_CAP = 40;
  var HISTORY_SKIP = 15;
  var RARE_WEIGHT = 0.15;
  var RARE_FINAL_CHANCE = 0.10;
  var RARE_FINAL_AFTER = 7;

  function esc(x) { return String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }

  function loadJSON(key) {
    try { return JSON.parse(localStorage.getItem(key) || '[]') || []; } catch (e) { return []; }
  }
  function saveJSON(key, arr) {
    try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {}
  }

  // pure pick: returns { item } or null. hist = recent ids, onceDone = ids shown once.
  function pickMemory(items, hist, onceDone, rnd) {
    var never = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.on === false) continue;
      if (it.once && onceDone.indexOf(it.id) !== -1) continue;
      never.push({ item: it, w: it.rare ? RARE_WEIGHT : 1 });
    }
    if (!never.length) return null;
    if (never.length > HISTORY_SKIP + 1) {
      var fresh = never.filter(function (e) { return hist.indexOf(e.item.id) === -1; });
      if (fresh.length) never = fresh;
    }
    var total = 0;
    for (var j = 0; j < never.length; j++) total += never[j].w;
    var r = rnd() * total;
    for (var k = 0; k < never.length; k++) {
      r -= never[k].w;
      if (r <= 0) return never[k].item;
    }
    return never[never.length - 1].item;
  }

  var items = [];
  var hist = loadJSON(HISTORY_KEY);
  var onceDone = loadJSON(ONCE_KEY);
  var sessionSeen = [];
  var lock = false;
  var rnd = Math.random;

  function stars() {
    if (reduce) return;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 34; i++) {
      var s = document.createElement('i');
      s.className = 'rm-star';
      s.style.left = (Math.random() * 100).toFixed(1) + '%';
      s.style.top = (Math.random() * 100).toFixed(1) + '%';
      s.style.opacity = (0.12 + Math.random() * 0.4).toFixed(2);
      s.style.animation = 'ashTwinkle ' + (2 + Math.random() * 3).toFixed(2) + 's ease-in-out ' + (Math.random() * 2).toFixed(2) + 's infinite';
      frag.appendChild(s);
    }
    document.body.appendChild(frag);
  }

  function catOf(it) {
    var c = (it.cat || '').trim();
    if (!c) return 'a little thing';
    return c.charAt(0).toUpperCase() + c.slice(1);
  }

  function remember(it) {
    if (it.id) {
      if (hist.indexOf(it.id) === -1) hist.unshift(it.id);
      if (hist.length > HISTORY_CAP) hist.length = HISTORY_CAP;
      saveJSON(HISTORY_KEY, hist);
      sessionSeen.push(it.id);
      if (it.once && onceDone.indexOf(it.id) === -1) {
        onceDone.push(it.id);
        saveJSON(ONCE_KEY, onceDone);
      }
    }
  }

  function showMemory(it) {
    var card = document.getElementById('rmCard');
    card.innerHTML =
      '<div class="rm-cat">' + esc(catOf(it)) + '</div>' +
      '<p>' + esc(it.text) + '</p>' +
      (it.rare ? '<div class="rm-rare">rare</div>' : '');
    card.classList.remove('rm-hidden');
    remember(it);
    var btn = document.getElementById('rmNext');
    btn.classList.add('rm-show');
    btn.disabled = false;
    lock = false;
  }

  function showFinalMoment() {
    var card = document.getElementById('rmCard');
    card.innerHTML =
      '<p>Funny how I remember these little things.</p>' +
      '<p style="margin-top:.9rem;">Maybe that\'s because they mattered to me.</p>';
    card.classList.remove('rm-hidden');
    document.getElementById('rmNext').classList.add('rm-show');
    document.getElementById('rmNext').disabled = false;
    lock = false;
  }

  function next() {
    if (lock) return;
    lock = true;
    var btn = document.getElementById('rmNext');
    btn.disabled = true;
    var card = document.getElementById('rmCard');
    card.classList.add('rm-hidden');
    if (reduce) { reveal(); return; }
    setTimeout(reveal, 600);
  }

  function reveal() {
    if (sessionSeen.length >= RARE_FINAL_AFTER && rnd() < RARE_FINAL_CHANCE) { showFinalMoment(); return; }
    var it = pickMemory(items, hist, onceDone, rnd);
    if (!it) {
      document.getElementById('rmCard').innerHTML =
        '<p class="rm-quiet">I\'m still writing these down.</p>' +
        '<p class="rm-quiet" style="margin-top:.7rem;">I remember more every day.</p>';
      document.getElementById('rmCard').classList.remove('rm-hidden');
      document.getElementById('rmNext').classList.add('rm-show');
      document.getElementById('rmNext').disabled = false;
      lock = false;
      return;
    }
    showMemory(it);
  }

  function begin() {
    stars();
    var title = document.getElementById('rmTitle');
    title.classList.remove('rm-hidden');
    setTimeout(function () {
      reveal();
      var btn = document.getElementById('rmNext');
      btn.classList.add('rm-show');
    }, DELAY * 1.6);
  }

  document.getElementById('rmNext').addEventListener('click', next);

  function load() {
    if (typeof FB === 'undefined' || !FB.getAll) { begin(); return; }
    FB.getAll('memories').then(function (list) {
      items = list || [];
      begin();
    }).catch(function () { items = []; begin(); });
  }

  load();
})();
</script>
</body>
</html>
