<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dream World &mdash; 100 prghs for eeshah</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;1,300;1,500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#181214; color:#ffebd2; font-family:Fraunces,Georgia,serif;
    overflow-x:hidden; min-height:100vh;
  }
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:#181214; }
  ::-webkit-scrollbar-thumb { background:#3a2a20; border-radius:2px; }

  #dreamContent {
    position:relative; z-index:3; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:2rem 1.5rem 4rem;
    pointer-events:none;
  }
  #dreamContent > * { pointer-events:auto; }

  .dream-title {
    font-size:clamp(2rem, 8vw, 4.5rem); font-weight:300; font-style:italic;
    color:#ffe8c8; text-align:center; margin-top:8vh;
    text-shadow:0 0 60px rgba(255,200,150,0.15), 0 0 120px rgba(200,150,255,0.08);
    animation:titlePulse 6s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { opacity:0.7; text-shadow:0 0 40px rgba(255,200,150,0.1); }
    50% { opacity:1; text-shadow:0 0 80px rgba(255,200,150,0.2), 0 0 160px rgba(200,150,255,0.12); }
  }

  .dream-subtitle {
    font-size:clamp(0.9rem, 3vw, 1.3rem); font-weight:300; font-style:italic;
    color:#c8b89e; text-align:center; margin-top:1rem; max-width:500px;
    opacity:0.7;
  }

  .dream-gallery {
    display:flex; flex-wrap:wrap; gap:1.5rem; justify-content:center;
    margin-top:4rem; max-width:900px; width:100%;
  }
  .dream-image {
    width:clamp(140px, 28vw, 260px); height:clamp(180px, 36vw, 340px);
    object-fit:cover; border-radius:12px; opacity:0;
    transform:translateY(30px) scale(0.95);
    transition:opacity 2s ease, transform 2s ease;
    box-shadow:0 8px 40px rgba(0,0,0,0.4);
    filter:brightness(0.85) saturate(0.9);
  }
  .dream-image.visible {
    opacity:0.75; transform:translateY(0) scale(1);
  }
  .dream-image:hover {
    opacity:1; transform:scale(1.03); filter:brightness(1) saturate(1);
    transition-duration:0.6s;
  }

  .dream-message {
    margin-top:4rem; max-width:600px; text-align:center;
    font-size:clamp(0.95rem, 2.5vw, 1.15rem); font-weight:300; font-style:italic;
    color:#c8b89e; line-height:1.9;
    opacity:0; transform:translateY(20px);
    transition:opacity 2.5s ease 1s, transform 2.5s ease 1s;
  }
  .dream-message.visible { opacity:0.8; transform:translateY(0); }

  .dream-return {
    margin-top:2rem; padding:0.7rem 1.8rem;
    background:rgba(255,220,160,0.06); border:1px solid rgba(255,210,150,0.15);
    color:#6b5f52; border-radius:8px; cursor:pointer;
    font-family:Fraunces,Georgia,serif; font-size:0.9rem; font-style:italic;
    transition:all 0.3s; text-decoration:none; display:inline-block;
  }
  .dream-return:hover { border-color:#ffe680; color:#ffe680; background:rgba(255,220,160,0.1); }

  /* floating petals */
  .dream-petal {
    position:fixed; pointer-events:none; z-index:2;
    font-size:14px; opacity:0;
    animation:petalFloat linear forwards;
  }
  @keyframes petalFloat {
    0% { opacity:0; transform:translateY(0) rotate(0deg) scale(0.5); }
    10% { opacity:0.25; }
    90% { opacity:0.25; }
    100% { opacity:0; transform:translateY(-100vh) rotate(720deg) scale(1); }
  }

  /* floating orbs */
  .dream-orb {
    position:fixed; pointer-events:none; z-index:1;
    border-radius:50%;
    animation:orbDrift 8s ease-in-out infinite;
  }
  @keyframes orbDrift {
    0%, 100% { transform:translate(0, 0); }
    25% { transform:translate(30px, -20px); }
    50% { transform:translate(-20px, -40px); }
    75% { transform:translate(20px, -10px); }
  }

  /* soft overlay glow */
  #dreamGlow {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 30%, rgba(200,150,255,0.03) 0%, transparent 60%);
  }
</style>
</head>
<body>

<div id="skyOverlay" style="position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.5;"></div>
<div id="dreamGlow"></div>

<div id="dreamContent">
  <div class="dream-title">A Dream of You</div>
  <div class="dream-subtitle">Where every thought of you floats softly in the light</div>

  <div class="dream-gallery" id="dreamGallery"></div>

  <div class="dream-message" id="dreamMessage">
    "In my dreams, you are always here —<br>
    your warmth beside me, your laughter in the air,<br>
    and the world is soft and golden,<br>
    just like the way I see you."
  </div>

  <a href="index.html" class="dream-return">&larr; Return from the dream</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="fb-db.js"></script>
<script src="skies.js"></script>
<script src="sky-living.js"></script>
<script src="landscape.js"></script>
<script src="interactive.js"></script>
<script src="track.js"></script>
  <script defer src="music.js"></script>
<script src="matrix-rain.js"></script>
<script src="global-easter-eggs.js"></script>

<script>
(function () {
  'use strict';
  var dreamSkyIndex = -1;
  var DREAM_SKIES = ['Dream Clouds', 'Cotton Candy Dream', 'Celestial Heaven', 'Infinite Love', 'Floating Lanterns'];

  // find dream skies
  var skies = window.Skies && window.Skies.SKIES;
  if (skies) {
    for (var i = 0; i < skies.length; i++) {
      if (DREAM_SKIES.indexOf(skies[i].name) !== -1) {
        dreamSkyIndex = i;
        break;
      }
    }
    if (dreamSkyIndex >= 0) {
      window.Skies.apply(dreamSkyIndex);
    }
  }

  // ===== Floating parallax images =====
  var ASH_IMAGES = [];
  for (var ai = 1; ai <= 13; ai++) ASH_IMAGES.push('./ash/ash' + ai + '.jpeg');
  ASH_IMAGES.push('./ash/ash_childhood.jpeg', './ash/ash_childhood1.jpeg', './ash/ash_childhood2.jpeg', './ash/ash_childhood3.jpeg');

  var gallery = document.getElementById('dreamGallery');
  var shuffled = ASH_IMAGES.slice().sort(function () { return Math.random() - 0.5; }).slice(0, 6);

  shuffled.forEach(function (src, idx) {
    var img = document.createElement('img');
    img.className = 'dream-image';
    img.src = src;
    img.alt = 'Dream image';
    img.loading = 'lazy';
    gallery.appendChild(img);
    setTimeout(function () { img.classList.add('visible'); }, 500 + idx * 400);
  });

  // ===== Dream message fade in =====
  setTimeout(function () {
    document.getElementById('dreamMessage').classList.add('visible');
  }, 3000);

  // ===== Floating petals =====
  var PETAL_CHARS = ['\uD83C\uDF38', '\uD83C\uDF3A', '\u2726', '\u2734', '\u00B7'];
  function spawnPetal() {
    var el = document.createElement('div');
    el.className = 'dream-petal';
    el.textContent = PETAL_CHARS[Math.floor(Math.random() * PETAL_CHARS.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.bottom = '-20px';
    el.style.fontSize = (8 + Math.random() * 12) + 'px';
    el.style.animationDuration = (10 + Math.random() * 15) + 's';
    el.style.animationDelay = (Math.random() * 3) + 's';
    document.body.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 28000);
  }
  for (var pi = 0; pi < 20; pi++) setTimeout(spawnPetal, pi * 600);
  setInterval(spawnPetal, 3000);

  // ===== Ambient floating orbs =====
  var ORB_COLORS = ['rgba(255,200,150,0.03)', 'rgba(200,150,255,0.03)', 'rgba(150,200,255,0.03)', 'rgba(255,150,200,0.03)'];
  var orbs = [];
  for (var oi = 0; oi < 6; oi++) {
    var orb = document.createElement('div');
    orb.className = 'dream-orb';
    var size = 40 + Math.random() * 80;
    orb.style.cssText = 'left:' + (Math.random() * 100) + 'vw;top:' + (Math.random() * 100) + 'vh;' +
      'width:' + size + 'px;height:' + size + 'px;' +
      'background:' + ORB_COLORS[Math.floor(Math.random() * ORB_COLORS.length)] + ';' +
      'box-shadow:0 0 ' + (size * 0.5) + 'px ' + ORB_COLORS[Math.floor(Math.random() * ORB_COLORS.length)] + ';' +
      'animation-delay:' + (Math.random() * 5) + 's;' +
      'animation-duration:' + (6 + Math.random() * 6) + 's;';
    document.body.appendChild(orb);
    orbs.push(orb);
  }

  // ===== Cinematic overlay light =====
  var glow = document.getElementById('dreamGlow');
  document.addEventListener('mousemove', function (e) {
    var x = e.clientX / window.innerWidth;
    var y = e.clientY / window.innerHeight;
    glow.style.background = 'radial-gradient(ellipse at ' + (x * 100) + '% ' + (y * 100) + '%, ' +
      'rgba(255,200,150,0.04) 0%, transparent 50%)';
  });

  // ===== Audio: try to load a song =====
  if (window.FB && FB.init) {
    FB.init();
    FB.getAll('songs').then(function (songs) {
      if (songs && songs.length) {
        var pick = songs[Math.floor(Math.random() * songs.length)];
        if (pick && pick.audioBlob) {
          var url = URL.createObjectURL(pick.audioBlob);
          var audio = new Audio(url);
          audio.loop = false;
          audio.volume = 0.25;
          audio.play().catch(function () {});
        }
      }
    }).catch(function () {});
  }

  // ===== Dreamlike scroll reveal =====
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) e.target.classList.add('visible');
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.dream-image, .dream-message').forEach(function (el) {
    observer.observe(el);
  });
})();
</script>

<script src="phase3-cinematic.js"></script>
</body>
</html>
