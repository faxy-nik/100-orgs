  <style>
    :root {
      --ink: #17130f;
      --ink-soft: #1e1811;
      --ink-line: #33291e;
      --parchment: #ffebd2;
      --parchment-dim: #c7b8a1;
      --ash: #6b5f52;
      --gold: #ffe680;
      --ember: #e85d3a;
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body: "Lora", Georgia, "Times New Roman", serif;
      --pad-inline: clamp(1.25rem, 6vw, 2.25rem);
      --glass: rgba(255, 220, 160, .08);
      --glassBorder: rgba(255, 210, 150, .35);
    }
    * { box-sizing: border-box; }
    body {
      cursor: url('cursor images/imresizer-meme-pop-cat-pack.jpg'), auto;

      margin: 0;
      background-color: #181214;
      color: var(--parchment);
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(160, 110, 60, 0.1), transparent 60%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(130, 50, 40, 0.06), transparent 60%);
    }
    .page-header {
      padding: clamp(2.5rem, 8vh, 4rem) var(--pad-inline) clamp(1rem, 3vh, 1.8rem);
      text-align: center;
    }
    .obs-sky-card:hover {
      border-color: var(--gold) !important;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(255,230,128,.12);
    }
    .obs-sky-card canvas {
      transition: transform 0.4s ease;
    }
    .obs-sky-card:hover canvas {
      transform: scale(1.05);
    }
    .obs-fav-btn:hover {
      transform: scale(1.2);
    }
    .obs-recent-item:hover {
      border-color: var(--gold) !important;
    }
    #obsSearch:focus {
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(255,230,128,.1);
    }
    #wishJournalPanel::-webkit-scrollbar { width: 4px; }
    #wishJournalPanel::-webkit-scrollbar-track { background: transparent; }
    #wishJournalPanel::-webkit-scrollbar-thumb { background: rgba(255,210,150,.15); border-radius: 2px; }
    #wishJournalPanel .wish-entry:hover { background: rgba(255,220,160,.06); }
    #lanternCanvas { display: block; }
    @keyframes toastIn{from{opacity:0;transform:translate(-50%,50%) scale(0.9)}to{opacity:1;transform:translate(-50%,50%) scale(1)}}
    #skyOverlay {
      z-index: 0 !important;
      opacity: 1 !important;
    }
    body {
      cursor: url('cursor images/imresizer-meme-pop-cat-pack.jpg'), auto;

      background: transparent !important;
    }
    .page-header, #observatory, .footer {
      position: relative;
      z-index: 1;
    }
  </style>

      <p style="color:var(--parchment-dim);font-size:clamp(0.85rem,2vw,1rem);font-style:italic;margin:0">Browse every sky. Find your atmosphere.</p>

  <script>
    (function() {
      var c = document.createElement('div');
      c.id = 'heartContainer';
      c.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9998;';
      document.body.appendChild(c);
      document.addEventListener('mousemove', function(e) {
        if (Math.random() > 0.12) return;
        var h = document.createElement('span');
        h.textContent = '\u2661';
        h.setAttribute('aria-hidden', 'true');
        h.style.cssText = 'position:absolute;left:' + e.clientX + 'px;top:' + e.clientY + 'px;font-size:' + (8 + Math.random() * 14) + 'px;color:rgba(255,100,150,' + (0.25 + Math.random() * 0.4) + ');pointer-events:none;animation:hFloat ' + (1.5 + Math.random() * 2) + 's ease-out forwards;';
        c.appendChild(h);
        setTimeout(function() { h.remove(); }, 3500);
      });
      var s = document.createElement('style');
      s.textContent = '@keyframes hFloat{0%{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}100%{opacity:0;transform:translateY(-90px) scale(0.2) rotate(20deg)}}';
      document.head.appendChild(s);
      var b = document.createElement('div');
      b.style.cssText = 'text-align:center;padding:2rem 1rem;position:relative;z-index:15;';
      var l = document.createElement('a');
      l.href = 'stats.html';
      l.textContent = '\uD83D\uDCCA Stats';
      l.style.cssText = 'background:rgba(255,220,160,.08);border:1px solid rgba(255,210,150,.15);color:#6b5f52;padding:.4rem .9rem;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.8rem;text-decoration:none;transition:all .25s;display:inline-block;margin:0 .4rem;';
      l.onmouseover = function() { this.style.borderColor = '#ffe680'; this.style.color = '#ffe680'; };
      l.onmouseout = function() { this.style.borderColor = 'rgba(255,210,150,.15)'; this.style.color = '#6b5f52'; };
      b.appendChild(l);
      var sb = document.createElement('span');
      sb.id = 'skyBtnContainer';
      b.appendChild(sb);
      document.body.appendChild(b);
      if (window.Skies) {
        Skies.createButton(document.getElementById('skyBtnContainer'));
        // Auto-apply saved sky on observatory page
        if (!window.FeatureFlags || window.FeatureFlags.get('sky-auto-apply')) {
          var idx = Skies.getCurrent();
          if (idx >= 0 && Skies.SKIES[idx]) { Skies.apply(idx); }
          else { Skies.apply(Skies.randomTimeAppropriate()); }
        }
      }
    })();
  </script>
