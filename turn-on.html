}
* { box-sizing: border-box; }
html, body {

/* Start screen */

  transition: all 0.4s;
  letter-spacing: 0.04em;

.start-btn:hover {

  color: var(--parchment);
  transform: scale(1.05);

}

/* Game screen */
#gameScreen {

}

/* Level indicator */

  display: flex;
  gap: 4px;
  justify-content: center;
  margin-bottom: 2rem;
  width: 100%;
  max-width: 300px;
}
.level-dot {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--ink-line);
  transition: background 0.5s;
}
.level-dot.lit { background: var(--ember); }
.level-dot.current { background: var(--gold); }

/* Prompt */
.prompt {
  text-align: center;
  margin-bottom: 2rem;
  position: relative;

.prompt .label {

  font-size: 0.7rem;

/* Options */

  flex-direction: column;
  gap: 0.75rem;
  width: 100%;
  max-width: 400px;
  margin: 0 auto 2rem;

.opt-btn {

.opt-btn:hover {
  border-color: var(--ember);
  color: var(--parchment);

/* History */

  text-align: right;
}

  color: var(--ash);
  font-style: italic;
  font-size: 0.75rem;
}
.history-item .choice-text {

}

/* Reset */
.reset-btn {
  display: block;
  margin: 2rem auto 0;
  padding: 0.4rem 1rem;
  border-radius: 6px;
  background: transparent;
  border: 1px solid var(--ink-line);
  color: var(--ash);
  font-family: var(--font-display);
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.3s;
}
.reset-btn:hover {
  border-color: var(--ember);
  color: var(--ember);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}

/* End screen */
#endScreen {
  display: none;
  text-align: center;
  animation: fadeIn 0.6s ease;
}
#endScreen h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.3rem, 4vw, 1.8rem);

}
#endScreen p {

  max-width: 400px;
}

/* Loading */
.loading {
  color: var(--ash);
  font-style: italic;
  font-size: 0.9rem;
}

<script>

function initGame() {
  var saved = localStorage.getItem('turn-on-state');
  if (saved) {
    try {
      state = JSON.parse(saved);
      if (state.stepId) {
        renderGame();
        return;
      }
    } catch (e) {}
  }
  showStart();
}

function showStart() {
  document.getElementById('startScreen').style.display = 'block';
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('endScreen').style.display = 'none';
}

function startGame() {
  state = { stepId: 1, history: [] };
  saveState();
  renderGame();
}

function getStep(id) {
  for (var i = 0; i < STEPS.length; i++) {
    if (STEPS[i].id === id) return STEPS[i];
  }
  return null;
}

function renderGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  document.getElementById('endScreen').style.display = 'none';

  var step = getStep(state.stepId);
  if (!step) {
    showEnd();
    return;
  }

  // Level bar
  var totalLevels = 10;
  var levelHtml = '';
  for (var i = 0; i < totalLevels; i++) {
    var cls = 'level-dot';
    if (i < step.level) cls += ' lit';
    else if (i === step.level) cls += ' current';
    levelHtml += '<div class="' + cls + '"></div>';
  }
  document.getElementById('levelBar').innerHTML = levelHtml;

  // Label
  document.getElementById('levelLabel').textContent = 'Level ' + (step.level + 1) + ' \u2014 ' + (LEVEL_NAMES[step.level] || '');

  // Prompt
  document.getElementById('promptText').textContent = step.prompt;

  // Options
  var optHtml = '';
  step.options.forEach(function (opt, oi) {
    optHtml += '<button class="opt-btn" data-next="' + opt.next + '">' + esc(opt.text) + '</button>';
  });
  document.getElementById('optionsContainer').innerHTML = optHtml;

  // Bind options
  document.querySelectorAll('.opt-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var next = parseInt(this.dataset.next);
      var text = this.textContent;
      state.history.push({ prompt: step.prompt, choice: text, stepId: state.stepId });
      if (next === -1) {
        state.stepId = null;
        saveState();
        showEnd();
      } else {
        state.stepId = next;
        saveState();
        renderGame();
      }
    });
  });

  // History
  renderHistory();
}

function renderHistory() {
  var html = '';
  state.history.forEach(function (h, i) {
    html += '<div class="history-item">' +
      '<span class="num">' + (i + 1) + '.</span>' +
      '<div><div class="choice-prompt">' + esc(h.prompt) + '</div><div class="choice-text">' + esc(h.choice) + '</div></div>' +
      '</div>';
  });
  document.getElementById('historyList').innerHTML = html;
}

function showEnd() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('endScreen').style.display = 'block';
}

function saveState() {
  localStorage.setItem('turn-on-state', JSON.stringify(state));
}

function resetGame() {
  localStorage.removeItem('turn-on-state');
  state = { stepId: null, history: [] };
  showStart();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('resetBtn').addEventListener('click', resetGame);
document.getElementById('endResetBtn').addEventListener('click', resetGame);

loadSteps();
</script>
