<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14100c">
<title>a letter that writes itself</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { margin: 0; background: #14100c; }
  body { min-height: 100vh; font-family: Georgia, serif; color: #f3e6d2; overflow-x: hidden; }
  .lw-stage {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 3rem 1.2rem 4rem; box-sizing: border-box; text-align: left; position: relative;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(60,48,72,.35), transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(255,214,120,.05), transparent 55%);
  }
  .lw-star { position: fixed; width: 2px; height: 2px; border-radius: 50%; background: #ffd68a; opacity: .2; pointer-events: none; }
  .lw-candle {
    position: fixed; bottom: 8%; left: 50%; transform: translateX(-50%); width: 140px; height: 140px; pointer-events: none;
    background: radial-gradient(circle, rgba(255,200,110,.10), rgba(255,200,110,.03) 55%, transparent 70%);
    border-radius: 50%; filter: blur(2px);
  }
  .lw-letter {
    position: relative; width: 100%; max-width: 620px; background: rgba(30,24,18,.85);
    border: 1px solid rgba(255,214,120,.13); border-radius: 6px;
    box-shadow: 0 12px 60px rgba(0,0,0,.55), inset 0 0 60px rgba(255,214,120,.03);
    padding: 2.2rem 2rem; box-sizing: border-box; margin-top: 1.4rem;
    opacity: 0; transform: translateY(14px); transition: opacity 1.2s ease, transform 1.2s ease;
    cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .lw-letter.lw-show { opacity: 1; transform: none; }
  .lw-date { color: #8a7a5e; font-size: .78rem; font-style: italic; letter-spacing: .08em; margin-bottom: 1.4rem; }
  .lw-greeting { color: #ffe680; font-style: italic; font-size: 1.12rem; margin-bottom: 1.6rem; letter-spacing: .05em; }
  .lw-body p { margin: 0 0 1.3rem; line-height: 1.9; color: #efe0c8; font-size: .98rem; white-space: pre-wrap; }
  .lw-body p.lw-caret::after { content: '|'; color: rgba(255,230,128,.75); animation: lwBlink 1s steps(1) infinite; margin-left: 1px; }
  @keyframes lwBlink { 50% { opacity: 0; } }
  .lw-sig { margin-top: 2rem; color: #ffe680; font-style: italic; letter-spacing: .12em; text-align: right; }
  .lw-final { color: #a08f7e; font-style: italic; text-align: center; margin-top: 1.8rem; opacity: 0; transition: opacity 1.6s ease; }
  .lw-keep { color: #8a7a5e; font-style: italic; text-align: center; margin-top: 2.6rem; font-size: .9rem; opacity: 0; transition: opacity 1.8s ease; }
  .lw-back {
    display: inline-block; margin-top: 1.1rem; padding: .7rem 1.6rem; border: 1px solid rgba(255,230,128,.28);
    border-radius: 999px; color: #ffe680; text-decoration: none; font-size: .85rem; letter-spacing: .08em;
    background: rgba(255,230,128,.05); opacity: 0; transition: opacity 1.6s ease, background .3s ease;
  }
  .lw-back:hover { background: rgba(255,230,128,.12); }
  .lw-bar {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: .8rem; padding: .9rem 1rem;
    background: linear-gradient(transparent, rgba(20,16,12,.92)); z-index: 5;
  }
  .lw-btn {
    padding: .6rem 1.3rem; border: 1px solid rgba(255,230,128,.3); border-radius: 999px; background: rgba(20,16,12,.55);
    color: #ffe680; font-family: Georgia, serif; font-style: italic; font-size: .85rem; cursor: pointer; letter-spacing: .05em;
  }
  .lw-btn:active { background: rgba(255,230,128,.14); }
  .lw-mute { border-color: rgba(255,230,128,.15); color: #a08f7e; }
  .lw-state { position: fixed; top: 1rem; right: 1.2rem; color: #6b5c47; font-size: .72rem; font-style: italic; letter-spacing: .15em; z-index: 6; }
  .lw-empty { color: #a08f7e; font-style: italic; text-align: center; margin-top: 3rem; line-height: 1.9; }
  .lw-hidden { display: none; }
  @media (max-width: 420px) {
    .lw-letter { padding: 1.6rem 1.2rem; }
    .lw-state { top: .7rem; right: .9rem; font-size: .65rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lw-letter, .lw-final, .lw-keep, .lw-back { transition: none; }
    .lw-star { display: none; }
    .lw-body p.lw-caret::after { animation: none; opacity: .5; }
  }
</style>
</head>
<body>
<div class="lw-stage">
  <div class="lw-candle"></div>
  <div class="lw-state" id="lwState"></div>

  <div class="lw-letter" id="lwLetter">
    <div class="lw-date" id="lwDate"></div>
    <div class="lw-greeting" id="lwGreeting"></div>
    <div class="lw-body" id="lwBody"></div>
    <div class="lw-sig" id="lwSig"></div>
    <div class="lw-final" id="lwFinal">I meant every word.</div>
    <div class="lw-keep" id="lwKeep">Keep this one.</div>
    <div style="text-align:center;"><a class="lw-back" id="lwBack" href="index.html">Back to our world</a></div>
  </div>

  <div class="lw-empty lw-hidden" id="lwEmpty">
    There is no letter here tonight.<br>
    But there will be.<br><br>
    <a href="index.html" style="color:#ffe680;font-style:italic;">Back to our world</a>
  </div>

  <div class="lw-bar" id="lwBar">
    <button class="lw-btn" id="lwPlayPause">Pause</button>
    <button class="lw-btn" id="lwSkip">Read it now</button>
    <button class="lw-btn lw-mute lw-hidden" id="lwMusic">Music</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="fb-db.js"></script>
<script src="seed-content.js"></script>
<script src="global-easter-eggs.js"></script>
<script src="activity-tracker.js"></script>

<script>
(function () {
  'use strict';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- punctuation-aware tokenizer: body -> tokens [{t, pause}] (pure) ----
  function tokenize(body) {
    var tokens = [];
    var buf = '';
    function flush() { if (buf) { tokens.push({ t: buf, pause: 18 + Math.floor(Math.random() * 14) }); buf = ''; } }
    for (var i = 0; i < body.length; i++) {
      var c = body[i];
      if (c === ',') { flush(); tokens.push({ t: ',', pause: 260 }); }
      else if (c === '.' || c === '!' || c === '?') { flush(); tokens.push({ t: c, pause: 440 }); }
      else if (c === ';' || c === ':' || c === '—') { flush(); tokens.push({ t: c, pause: 320 }); }
      else if (c === ' ') { flush(); tokens.push({ t: ' ', pause: 28 }); }
      else if (c === '\n') { flush(); tokens.push({ t: '\n', pause: 40 }); }
      else buf += c;
    }
    flush();
    return tokens;
  }

  function loadJSON(key) { try { return JSON.parse(localStorage.getItem(key) || '[]') || []; } catch (e) { return []; } }
  function saveJSON(key, arr) { try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {} }

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // ---- letter selection: scheduled wins; secret only in secret mode; avoid repeats (pure) ----
  function pickLetter(letters, today, hist, secretMode, dayRnd) {
    var pool = [];
    for (var i = 0; i < letters.length; i++) {
      var l = letters[i];
      if (!l || l.enabled === false) continue;
      if (l.secret && !secretMode) continue;
      pool.push(l);
    }
    if (!pool.length) return null;
    for (var j = 0; j < pool.length; j++) {
      if (pool[j].scheduledDate === today) return pool[j];
    }
    if (pool.length > 1) {
      var fresh = pool.filter(function (l) { return hist.indexOf(String(l.id)) === -1; });
      if (fresh.length) pool = fresh;
    }
    pool.sort(function (a, b) { return (b.priority || 0) - (a.priority || 0) || (b.createdAt || 0) - (a.createdAt || 0); });
    // daily rotation: among the top-priority tier, the pick changes by date (like for-tonight)
    if (dayRnd && pool.length > 1) {
      var top = pool[0] ? (pool[0].priority || 0) : 0;
      var tier = pool.filter(function (l) { return (l.priority || 0) === top; });
      if (tier.length > 1) return tier[Math.floor(dayRnd() * tier.length)];
    }
    return pool[0];
  }

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function daySeed() {
    var d = new Date();
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  var HIST_KEY = 'ash_selfletter_hist';
  var hist = loadJSON(HIST_KEY);
  var letter = null;
  var tokens = [];
  var paras = [];
  var paraIdx = 0, tokenIdx = 0;
  var timer = null;
  var paused = false;
  var done = false;
  var audioEl = null;

  function stars() {
    if (reduce) return;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 30; i++) {
      var s = document.createElement('i');
      s.className = 'lw-star';
      s.style.left = (Math.random() * 100).toFixed(1) + '%';
      s.style.top = (Math.random() * 100).toFixed(1) + '%';
      s.style.opacity = (0.1 + Math.random() * 0.35).toFixed(2);
      s.style.animation = 'ashTwinkle ' + (2 + Math.random() * 3).toFixed(2) + 's ease-in-out ' + (Math.random() * 2).toFixed(2) + 's infinite';
      frag.appendChild(s);
    }
    document.body.appendChild(frag);
  }

  function showLetter() {
    document.getElementById('lwLetter').classList.add('lw-show');
    document.getElementById('lwDate').textContent = letter.date || todayKey();
    document.getElementById('lwGreeting').textContent = (letter.recipient || 'Dear Ash') + ',';
    document.getElementById('lwSig').textContent = letter.signature || 'Faxy';
  }

  function newPara() {
    var p = document.createElement('p');
    document.getElementById('lwBody').appendChild(p);
    p.classList.add('lw-caret');
    return p;
  }

  function revealAll() {
    stopTimer();
    document.getElementById('lwBody').innerHTML = '';
    var body = letter.body || '';
    body.split(/\n+/).forEach(function (par) {
      var p = newPara();
      p.classList.remove('lw-caret');
      p.textContent = par;
    });
    endLetter();
  }

  function endLetter() {
    done = true;
    paused = false;
    document.getElementById('lwState').textContent = '';
    document.getElementById('lwPlayPause').textContent = 'Pause';
    document.getElementById('lwPlayPause').disabled = true;
    document.getElementById('lwSkip').disabled = true;
    setTimeout(function () {
      document.getElementById('lwFinal').style.opacity = '1';
      setTimeout(function () {
        document.getElementById('lwKeep').style.opacity = '1';
        document.getElementById('lwBack').style.opacity = '1';
      }, reduce ? 0 : 2200);
    }, reduce ? 300 : 1600);
  }

  function nextToken() {
    timer = null;
    if (done) return;
    if (paused) { document.getElementById('lwState').textContent = 'paused'; return; }

    if (tokenIdx >= tokens.length) {
      var p = document.getElementById('lwBody').lastChild;
      if (p) p.classList.remove('lw-caret');
      endLetter();
      return;
    }
    var tok = tokens[tokenIdx++];
    if (tok.t === '\n') {
      var cur = document.getElementById('lwBody').lastChild;
      if (cur) cur.classList.remove('lw-caret');
      newPara();
    } else {
      var el = document.getElementById('lwBody').lastChild;
      if (!el) el = newPara();
      el.textContent += tok.t;
      if (el.getBoundingClientRect().bottom > window.innerHeight - 90) {
        try { el.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); } catch (e) { el.scrollIntoView(); }
      }
    }
    var pause = tok.pause;
    if (tokens[tokenIdx] && tokens[tokenIdx].pause >= 440 && tok.pause >= 440) pause += 300;
    timer = setTimeout(nextToken, reduce ? 0 : pause);
  }

  function stopTimer() { if (timer) { clearTimeout(timer); timer = null; } }

  function write() {
    document.getElementById('lwPlayPause').textContent = 'Pause';
    document.getElementById('lwPlayPause').disabled = false;
    document.getElementById('lwSkip').disabled = false;
    newPara();
    paused = false;
    document.getElementById('lwState').textContent = '';
    if (reduce) { revealAll(); return; }
    nextToken();
  }

  function togglePause() {
    if (done) return;
    if (paused) {
      paused = false;
      document.getElementById('lwState').textContent = '';
      document.getElementById('lwPlayPause').textContent = 'Pause';
      nextToken();
    } else {
      paused = true;
      stopTimer();
      document.getElementById('lwState').textContent = 'paused';
      document.getElementById('lwPlayPause').textContent = 'Resume';
    }
  }

  function rememberShown() {
    if (!letter || !letter.id) return;
    if (hist.indexOf(String(letter.id)) === -1) hist.unshift(String(letter.id));
    if (hist.length > 20) hist.length = 20;
    saveJSON(HIST_KEY, hist);
  }

  function start() {
    stars();
    var el = document.getElementById('lwLetter');
    if (reduce) { el.classList.add('lw-show'); }
    else { el.classList.add('lw-show'); }
    showLetter();
    tokens = tokenize(letter.body || '');
    rememberShown();
    if (letter.music) setupMusic(letter.music);
    write();
  }

  function setupMusic(file) {
    var btn = document.getElementById('lwMusic');
    btn.classList.remove('lw-hidden');
    audioEl = document.createElement('audio');
    audioEl.src = 'songs/' + file;
    audioEl.loop = false;
    btn.addEventListener('click', function () {
      if (audioEl.paused) { audioEl.play().catch(function () {}); btn.textContent = 'Music'; }
      else { audioEl.pause(); btn.textContent = 'Music'; }
    });
  }

  document.getElementById('lwPlayPause').addEventListener('click', togglePause);
  document.getElementById('lwSkip').addEventListener('click', function () { if (!done) revealAll(); });
  document.getElementById('lwLetter').addEventListener('click', function (e) {
    if (e.target.tagName === 'A') return;
    togglePause();
  });

  function load() {
    var dayRnd = mulberry32(daySeed());
    if (window.SEED_CONTENT) window.SEED_CONTENT.seedAll();
    if (typeof FB === 'undefined' || !FB.getAll) {
      if (window.SEED_CONTENT) { letter = pickLetter(window.SEED_CONTENT.letters, todayKey(), hist, window.location.search.indexOf('secret') !== -1, dayRnd); }
      if (letter) start(); else showEmpty();
      return;
    }
    var secretMode = window.location.search.indexOf('secret') !== -1;
    FB.getAll('selfLetters').then(function (list) {
      var pool = (list && list.length) ? list : (window.SEED_CONTENT ? window.SEED_CONTENT.letters : []);
      letter = pickLetter(pool, todayKey(), hist, secretMode, dayRnd);
      if (!letter) { showEmpty(); return; }
      start();
    }).catch(function () {
      var pool = window.SEED_CONTENT ? window.SEED_CONTENT.letters : [];
      letter = pickLetter(pool, todayKey(), hist, secretMode, dayRnd);
      if (!letter) { showEmpty(); return; }
      start();
    });
  }

  function showEmpty() {
    document.getElementById('lwEmpty').classList.remove('lw-hidden');
    document.getElementById('lwBar') && (document.getElementById('lwBar').style.display = 'none');
  }

  load();
})();
</script>
</body>
</html>
